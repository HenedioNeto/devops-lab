name: Deploy

on:
  workflow_run:
    workflows: ["Docker"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          cd ~/devops-lab
          docker compose pull
          docker compose up -d

      - name: Health check
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:8080/actuator/health; then
              exit 0
            fi
          
            echo "Aguardando aplicação..."
            sleep 5
          done
          
          echo "Aplicação não ficou saudável"
          exit 1